<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deadlock Mastery</title>
  <meta name="theme-color" content="#0b0a09">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 16 16 30 2 16Z' fill='%230b0a09' stroke='%23d9b56a' stroke-width='2'/%3E%3Cpath d='M9 16q7-7 14 0-7 7-14 0Z' fill='none' stroke='%23d9b56a' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23d9b56a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Marcellus+SC&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Shared paint: metal gradients for every rank tier + glow filter. Referenced by inline SVGs. -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="m-ash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a39d92"/><stop offset=".5" stop-color="#57514a"/><stop offset="1" stop-color="#7d776d"/></linearGradient>
      <linearGradient id="m-bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c995"/><stop offset=".35" stop-color="#bf7c45"/><stop offset=".7" stop-color="#6e3f1c"/><stop offset="1" stop-color="#d69a62"/></linearGradient>
      <linearGradient id="m-silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#c3c9cf"/><stop offset=".7" stop-color="#6f7780"/><stop offset="1" stop-color="#e6eaee"/></linearGradient>
      <linearGradient id="m-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c2"/><stop offset=".35" stop-color="#e4bd5e"/><stop offset=".7" stop-color="#8f6620"/><stop offset="1" stop-color="#f6da8f"/></linearGradient>
      <linearGradient id="m-jade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4fff0"/><stop offset=".35" stop-color="#62c9a1"/><stop offset=".7" stop-color="#1d6a51"/><stop offset="1" stop-color="#a6ecd0"/></linearGradient>
      <linearGradient id="m-amethyst" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4e9ff"/><stop offset=".35" stop-color="#b897ee"/><stop offset=".7" stop-color="#553592"/><stop offset="1" stop-color="#ddc9ff"/></linearGradient>
      <linearGradient id="m-radiant" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#fff0bd"/><stop offset=".65" stop-color="#e7a93c"/><stop offset="1" stop-color="#fffbe6"/></linearGradient>
      <radialGradient id="core-glow" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#2d271e"/><stop offset="1" stop-color="#0e0c0a"/></radialGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
  </svg>

  <div class="atmos" aria-hidden="true"><div class="smoke a"></div><div class="smoke b"></div><div class="smoke c"></div></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Deadlock Mastery home">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 2 38 20 20 38 2 20Z" class="bm-o"/><path d="M20 7 33 20 20 33 7 20Z" class="bm-i"/>
        <path d="M11 20q9-8.5 18 0-9 8.5-18 0Z" class="bm-eye"/><circle cx="20" cy="20" r="3" class="bm-pupil"/>
      </svg>
      <span class="brand-text"><span>Deadlock</span><em>Mastery</em></span>
    </a>
    <nav class="jump" aria-label="Sections">
      <a data-nav="overview" href="#">Overview</a>
      <a data-nav="heroes" href="#">Heroes</a>
      <a data-nav="matches" href="#">Ledger</a>
      <a data-nav="ladder" href="#">Ladders</a>
      <a data-nav="compare" href="#">Compare</a>
      <a data-nav="codex" href="#">Codex</a>
    </nav>
    <div class="seg view-toggle" role="group" aria-label="Show">
      <button type="button" data-view="xp" aria-pressed="true">Mastery XP</button>
      <button type="button" data-view="stats" aria-pressed="false">Core Stats</button>
    </div>
    <form id="lookup" class="lookup" autocomplete="off">
      <svg class="lk-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5"/></svg>
      <input id="lookup-input" type="text" placeholder="SteamID, profile link or name" aria-label="Steam account">
      <button type="submit" class="btn-gold">Load</button>
      <div id="search-results" class="search-results" hidden></div>
    </form>
    <div id="me-slot" class="me-slot"></div>
    <button id="share" class="btn-ghost icon-btn" type="button" title="Copy a link to this page" aria-label="Copy link to this page">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 12a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M12 8a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/></svg>
    </button>
    <button id="refresh" class="btn-ghost icon-btn" type="button" title="Pull new matches" aria-label="Refresh">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 3v4h-4"/></svg>
    </button>
  </header>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <main id="app">
    <div id="loader" class="loader" hidden>
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="90" class="ld-ring"/>
        <g class="ld-spin"><path d="M100 14 186 100 100 186 14 100Z" class="ld-dia"/><circle cx="100" cy="14" r="4" class="ld-dot"/></g>
        <g class="ld-spin rev"><path d="M100 40 160 100 100 160 40 100Z" class="ld-dia"/></g>
        <path d="M70 100q30-28 60 0-30 28-60 0Z" class="ld-eye"/><circle cx="100" cy="100" r="7" class="ld-dot"/>
      </svg>
      <p>Consulting the ledgers…</p>
    </div>
    <div id="page"></div>
  </main>

  <div id="ceremony" class="ceremony" hidden role="dialog" aria-modal="true" aria-label="Rank achieved"></div>

  <footer class="foot">
    <svg viewBox="0 0 120 12" aria-hidden="true"><path d="M0 6h48M72 6h48" /><path d="M60 0 66 6 60 12 54 6Z"/></svg>
    <p>Match data from <a href="https://deadlock-api.com" target="_blank" rel="noopener">deadlock-api.com</a>. A fan project, not affiliated with Valve. <a href="#start">Look up another player</a><span id="discord-link"></span></p>
  </footer>

  <script src="data/baselines.js"></script>
  <script src="data/assets.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/voicelines.js"></script>
  <script src="js/core.js"></script>
  <script src="js/components.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/matches.js"></script>
  <script src="js/pages/heroes.js"></script>
  <script src="js/pages/hero.js"></script>
  <script src="js/pages/match.js"></script>
  <script src="js/pages/codex.js"></script>
  <script src="js/pages/compare.js"></script>
  <script src="js/pages/welcome.js"></script>
  <script src="js/pages/ladder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
